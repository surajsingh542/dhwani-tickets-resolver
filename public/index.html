<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auto Ticket Resolver</title>
<style>
  :root { color-scheme: light; --bg:#f7f7f8; --card:#fff; --fg:#1d1d1f; --muted:#6b6b73; --line:#e3e3e8; --accent:#9a1f40; --link:#9a1f40; --ok:#1f7a3f; --warn:#a15c00; --bad:#b3261e; }
  /* Dark when the system asks for it (unless Light was chosen), or when Dark was chosen. */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg:#151517; --card:#1f1f23; --fg:#ececf0; --muted:#9a9aa3; --line:#33333a; --accent:#c8466a; --link:#f08aa4; --ok:#5cc489; --warn:#e3a54a; --bad:#f2786f; } }
  :root[data-theme="dark"] { color-scheme: dark; --bg:#151517; --card:#1f1f23; --fg:#ececf0; --muted:#9a9aa3; --line:#33333a; --accent:#c8466a; --link:#f08aa4; --ok:#5cc489; --warn:#e3a54a; --bad:#f2786f; }
  a { color: var(--link); text-underline-offset: 2px; }
  a:hover { text-decoration-thickness: 2px; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
  .head h1 { margin:0; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input, textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  textarea { min-height:60px; font-family:ui-monospace, monospace; font-size:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  button { padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .check { display:flex; gap:6px; align-items:center; color:var(--fg); font-size:13px; }
  .check input { width:auto; }
  #log { height:380px; overflow:auto; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; font:12px/1.4 ui-monospace, monospace; white-space:pre-wrap; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .resolved { color:var(--ok); } .needs_clarification { color:var(--warn); } .failed { color:var(--bad); }
  .muted { color:var(--muted); }
  .tablewrap { overflow-x:auto; }
</style>
</head>
<body>
<main>
  <div class="head">
    <h1>Auto Ticket Resolver</h1>
    <button id="theme" title="Theme: follow the system, light or dark">Theme: Auto</button>
  </div>

  <div class="card">
    <div class="grid">
      <div><label for="project">Hub project</label><input id="project" placeholder="ICIC/P382-02" /></div>
      <div><label for="repoPath">Local repository path</label><input id="repoPath" placeholder="/home/you/code/project" /></div>
      <div><label for="mainApp">Main app / repo folder (optional)</label><input id="mainApp" placeholder="icicif" /></div>
      <div><label for="assignee">Assignee filter (optional)</label><input id="assignee" placeholder="email, name or me" /></div>
      <div><label for="createdBy">Created-by filter (optional)</label><input id="createdBy" placeholder="email, name or me" /></div>
      <div><label for="model">Claude model (optional)</label><input id="model" placeholder="CLI default, e.g. claude-opus-5-5" /></div>
      <div><label for="testCommand">Test command (optional gate)</label><input id="testCommand" placeholder="npm test" /></div>
      <div><label for="limit">Max tickets (0 = all)</label><input id="limit" type="number" min="0" value="0" /></div>
      <div><label for="only">Only these tickets (optional)</label><input id="only" placeholder="TASK-2026-02411, TASK-2026-02617" /></div>
      <div><label for="progress">Progress summary every N min (0 = off)</label><input id="progress" type="number" min="0" value="5" /></div>
    </div>
    <div style="margin-top:12px">
      <label for="cookie">Hub session cookie <span id="cookieHint" class="muted"></span></label>
      <textarea id="cookie" placeholder="sid=…; system_user=yes; full_name=…  (or just the sid value)"></textarea>
      <label for="cookieFile" style="margin-top:8px">…or a cookie file path</label>
      <input id="cookieFile" placeholder="/home/you/cookie.txt" />
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="hubWrite" checked /> Update Hub (stages + clarification comments)</label>
      <label class="check"><input type="checkbox" id="force" /> Redo tickets handled in earlier runs</label>
      <label class="check"><input type="checkbox" id="fixPre" checked /> Fix pre-existing test failures after the tickets</label>
    </div>
    <div class="row">
      <span class="muted">Priorities:</span><span id="prioBoxes" class="row" style="margin:0"></span>
    </div>
    <div class="row">
      <span class="muted">Types:</span><span id="typeBoxes" class="row" style="margin:0"></span>
    </div>
    <div class="row">
      <span class="muted">Stages:</span><span id="stageBoxes" class="row" style="margin:0"></span>
      <span class="muted" style="font-size:12px">(the project's stages on the Hub)</span>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="parallel" /> Work on tickets in parallel (separate worktrees; bench checks and merges stay one at a time)</label>
      <label class="check">Max concurrent <input type="number" id="maxConcurrent" min="1" max="10" value="3" style="width:70px" /></label>
      <label class="check"><input type="checkbox" id="perTicket" checked /> New Claude session for every ticket (fewer tokens)</label>
    </div>
    <div class="row">
      <button id="inspect">Inspect queue</button>
      <button id="preview">Dry run (download context only)</button>
      <button id="start" class="primary">Start resolving</button>
      <button id="fixFailures">Fix pre-existing failures only</button>
      <button id="stop">Stop after current ticket</button>
      <span id="msg" class="muted"></span>
    </div>
  </div>

  <div class="card" id="lockBanner" hidden style="border-color:var(--warn)"></div>
  <div class="card" id="errorBanner" hidden style="border-color:var(--bad);color:var(--bad)"></div>

  <div class="card">
    <div class="row" style="margin-top:0;justify-content:space-between">
      <strong id="phase">Idle</strong>
      <span>
        <a href="/api/reports/resolved" id="r1">Resolved.xlsx</a> ·
        <a href="/api/reports/clarification" id="r2">Clarification.xlsx</a> ·
        <a href="/api/reports/notResolved" id="r3">Not resolved.xlsx</a> ·
        <a href="/api/reports/preexisting" id="r4">Pre-existing failures.xlsx</a>
      </span>
    </div>
    <div class="tablewrap"><table id="queue"><thead><tr><th>#</th><th>Ticket</th><th>Priority</th><th>Type</th><th>Stage</th><th>Outcome</th></tr></thead><tbody></tbody></table></div>
  </div>

  <div class="card"><div id="log"></div></div>
</main>
<script>
const $ = (id) => document.getElementById(id);

// Theme: auto (system) → light → dark, remembered in this browser only.
const THEMES = ['auto', 'light', 'dark'];
function applyTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  $('theme').textContent = `Theme: ${t[0].toUpperCase()}${t.slice(1)}`;
}
let theme = 'auto';
try { theme = THEMES.includes(localStorage.getItem('atr:theme')) ? localStorage.getItem('atr:theme') : 'auto'; } catch { /* storage blocked */ }
applyTheme(theme);
$('theme').onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  applyTheme(theme);
  try { localStorage.setItem('atr:theme', theme); } catch { /* storage blocked */ }
};
const body = (extra = {}) => ({
  project: $('project').value.trim(), repoPath: $('repoPath').value.trim(), mainApp: $('mainApp').value.trim() || undefined,
  assignee: $('assignee').value.trim() || undefined, createdBy: $('createdBy').value.trim() || undefined, cookie: $('cookie').value.trim() || undefined,
  testCommand: $('testCommand').value.trim() || undefined, limit: Number($('limit').value) || 0,
  hubWrite: $('hubWrite').checked, force: $('force').checked, fixPreexisting: $('fixPre').checked,
  only: $('only').value.trim() || undefined, progressIntervalMinutes: $('progress').value,
  model: $('model').value.trim() || undefined, cookieFile: $('cookieFile').value.trim() || undefined,
  parallel: $('parallel').checked, maxConcurrent: Number($('maxConcurrent').value) || undefined,
  sessionPerTicket: $('perTicket').checked,
  priorities: [...document.querySelectorAll('#prioBoxes input:checked')].map((i) => i.value),
  types: [...document.querySelectorAll('#typeBoxes input:checked')].map((i) => i.value),
  stages: [...document.querySelectorAll('#stageBoxes input:checked')].map((i) => i.value),
  ...extra,
});
const post = async (url, data) => {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function renderQueue(queue, done = [], running = []) {
  const outcomes = Object.fromEntries(done.map((d) => [d.id, d]));
  $('queue').querySelector('tbody').innerHTML = queue.map((q, i) => {
    const d = outcomes[q.id];
    const out = d ? `<span class="${d.outcome}">${esc(d.outcome)}</span>${d.error ? `<div class="muted">${esc(d.error.split('\n')[0])}</div>` : ''}`
      : (running || []).find((c) => c.id === q.id) ? `<em>${esc(running.find((c) => c.id === q.id).step)}</em>` : '';
    return `<tr><td>${i + 1}</td><td>${esc(q.id)}<div class="muted">${esc(q.subject)}</div></td><td>${esc(q.priority || q.priorityKey)}</td><td>${esc(q.type)}</td><td>${esc(q.stage)}</td><td>${out}</td></tr>`;
  }).join('');
}

$('inspect').onclick = async () => {
  $('msg').textContent = 'Inspecting…';
  try {
    const r = await post('/api/inspect', body());
    if (r.pipelineStages?.length) renderStages(r.pipelineStages, [...document.querySelectorAll('#stageBoxes input:checked')].map((i) => i.value));
    renderQueue(r.queue);
    $('msg').textContent = `${r.totalTickets} tickets, ${r.queue.length} pickable, ${r.skipped.length} skipped. Stages: ${(r.pipelineStages || []).join(', ')}`;
    $('log').textContent = JSON.stringify({ distinct: r.distinct, skipped: r.skipped }, null, 2);
  } catch (e) { $('msg').textContent = e.message; }
};
const start = (dryRun) => async () => {
  if (!dryRun && !confirm('Start resolving? Claude will edit the repository, ticket branches will be pushed, and Hub stages will change.')) return;
  try { await post('/api/runs', body({ dryRun })); $('msg').textContent = 'Started.'; $('log').textContent = ''; listen(); }
  catch (e) { $('msg').textContent = e.message; }
};
$('preview').onclick = start(true);
$('start').onclick = start(false);
$('fixFailures').onclick = async () => {
  if (!confirm('Fix the recorded pre-existing test failures? Each gets its own branch, pushed and merged into local development.')) return;
  try { await post('/api/runs', body({ onlyPreexisting: true })); $('msg').textContent = 'Started.'; $('log').textContent = ''; listen(); }
  catch (e) { $('msg').textContent = e.message; }
};
$('stop').onclick = () => post('/api/runs/current/stop', {});

let es;
function listen() {
  es?.close();
  es = new EventSource('/api/runs/current/events');
  es.onmessage = (ev) => {
    const log = $('log'); const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
    log.textContent += JSON.parse(ev.data) + '\n'; if (atBottom) log.scrollTop = log.scrollHeight;
  };
}

async function poll() {
  try {
    const s = await (await fetch('/api/runs/current')).json();
    $('phase').textContent = s.phase === 'idle' ? 'Idle' : `${s.dryRun ? 'Dry run' : 'Run'} — ${s.phase}${s.project ? ' · ' + s.project : ''}${s.error ? ' · ' + s.error : ''}`;
    if (s.queue?.length) renderQueue(s.queue, s.done, s.running || (s.current ? [s.current] : []));
    // Why the run stopped / could not start, or why it is waiting — impossible to miss.
    const banner = $('errorBanner');
    if (s.phase === 'paused' && s.pausedUntil) {
      banner.hidden = false; banner.style.color = 'var(--warn)'; banner.style.borderColor = 'var(--warn)';
      banner.textContent = `⏸ Paused: Claude usage limit reached. Resuming automatically at ${new Date(s.pausedUntil).toLocaleTimeString()}.`;
    } else if (s.error) {
      banner.hidden = false; banner.style.color = 'var(--bad)'; banner.style.borderColor = 'var(--bad)';
      banner.textContent = `⚠ ${s.error}`;
    } else banner.hidden = true;
    const locks = await (await fetch('/api/locks')).json();
    const others = locks.filter((l) => !l.mine);
    $('lockBanner').hidden = !others.length;
    $('lockBanner').innerHTML = others.map((l) => `⚠ Another run is active — <b>${esc(l.owner)}</b> (pid ${l.pid}, since ${esc(new Date(l.startedAt).toLocaleString())}).<div class="muted">${l.paths.map(esc).join('<br>')}</div>`).join('<hr>');
    const busy = ['starting', 'running'].includes(s.phase);
    $('start').disabled = $('preview').disabled = $('fixFailures').disabled = busy;
    for (const id of ['r1', 'r2', 'r3', 'r4']) { const a = $(id); const u = new URL(a.href); if (s.project) u.searchParams.set('project', s.project); a.href = u; }
  } catch { /* server restarting */ }
}

fetch('/api/defaults').then((r) => r.json()).then((d) => {
  const boxes = (el, values, on = values, label = (v) => v) => { $(el).innerHTML = values.map((v) => `<label class="check"><input type="checkbox" value="${esc(v)}" ${on.includes(v) ? 'checked' : ''} /> ${esc(label(v))}</label>`).join(''); };
  boxes('prioBoxes', d.priorities || [], d.prioritiesOn || d.priorities || [], (v) => (v === 'NONE' ? 'No priority' : v));
  boxes('typeBoxes', d.types || [], d.typesOn || d.types || [], (v) => (v === 'NONE' ? 'No type' : v));
  // Only the Hub's real stages are shown; a stage is ticked when it matches one of the chosen spellings.
  const nm = (x) => String(x).toLowerCase().replace(/[^a-z0-9]/g, '');
  window.renderStages = (all, on) => {
    const want = new Set(on.map(nm));
    $('stageBoxes').innerHTML = all.map((v) => `<label class="check"><input type="checkbox" value="${esc(v)}" ${want.has(nm(v)) ? 'checked' : ''} /> ${esc(v)}</label>`).join('');
  };
  renderStages(['Open', 'Reopened'], ['Open', 'Reopened']);
  window.loadStages = async () => {
    try {
      const r = await post('/api/stages', body());
      if (r.stages?.length) renderStages(r.stages, [...document.querySelectorAll('#stageBoxes input:checked')].map((i) => i.value).concat(r.picked));
    } catch { /* Hub not reachable yet (no cookie): keep Open + Reopened */ }
  };
  loadStages();
  for (const id of ['project', 'cookieFile']) $(id).addEventListener('change', () => loadStages());
  $('cookie').addEventListener('change', () => loadStages());
  $('parallel').checked = Boolean(d.parallel); $('maxConcurrent').value = d.maxConcurrent || 3;
  $('perTicket').checked = d.sessionPerTicket !== false;
  $('project').value = d.project || ''; $('repoPath').value = d.repoPath || ''; $('mainApp').value = d.mainApp || ''; $('model').value = d.model || ''; $('cookieFile').value = d.cookieFile || ''; $('testCommand').value = d.testCommand || '';
  $('cookieHint').textContent = d.hasCookie ? '(leave both empty to use the cookie from .env)' : '';
});
listen(); poll(); setInterval(poll, 3000);
</script>
</body>
</html>
